[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-duck-lite"
version = "0.4.0"
description = "Hardware-First tooling for the Mini Duck Physical AI Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
policy = [
  "onnx>=1.19,<2",
]

[project.scripts]
mini-duck-g0 = "mini_duck_lite.g0:main"
mini-duck-hardware-audit = "mini_duck_lite.manifest:main"
mini-duck-qualify = "mini_duck_lite.qualification:main"
mini-duck-runtime = "mini_duck_lite.runtime:main"
mini-duck-package-policy = "mini_duck_lite.policy_bundle:main"

[dependency-groups]
dev = [
  "onnx>=1.19,<2",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_duck_lite"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
