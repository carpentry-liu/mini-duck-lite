[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-duck-lite"
version = "0.3.0"
description = "Gate-driven tooling for the Mini Duck Physical AI Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
mini-duck-g0 = "mini_duck_lite.g0:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_duck_lite"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
