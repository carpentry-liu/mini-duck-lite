<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MicroDuck 物理回放</title>
<style>
:root{--bg:#07101c;--panel:#0d1a2b;--line:#2b3d53;--text:#e5edf5;--muted:#8ba0b6;--accent:#ffae45}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}
header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0} .badge{color:#5de0b2} main{display:grid;grid-template-columns:minmax(620px,1.35fr) minmax(470px,.65fr);gap:18px;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden} video{display:block;width:100%;background:#000}
.note{padding:12px 16px;color:var(--muted)} .side{display:grid;gap:18px} .card-pad{padding:18px} h2{font-size:17px;margin:0 0 14px}
.joint-map{height:270px;position:relative;background:radial-gradient(circle at 50% 45%,#182b42 0 12%,transparent 13%),linear-gradient(90deg,transparent 49.5%,#263a50 50%,transparent 50.5%);border:1px solid var(--line);border-radius:10px}
.joint{position:absolute;transform:translate(-50%,-50%);border:1px solid #53677d;background:#13263a;color:var(--text);border-radius:999px;padding:7px 10px;cursor:pointer;white-space:nowrap;font-size:12px}
.joint:hover,.joint.active{background:var(--accent);color:#111;border-color:var(--accent)} canvas{width:100%;height:230px;background:#07111e;border-radius:9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px} .stat{padding:9px;background:#081522;border-radius:8px} .stat b{display:block;color:var(--accent)}
.legend{color:var(--muted);font-size:13px} @media(max-width:1000px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>MicroDuck 物理分析回放</h1><span class="badge">SIM · MuJoCo · 50 Hz</span></header>
<main>
  <section class="card"><video id="video" controls preload="metadata" src="../roller_fast_carve_physics_overlay_50fps.mp4"></video><div class="note">分析视频会自动轮播代表关节；右侧点击关节可独立检查该关节六维力/力矩曲线。红蓝场和涡旋为派生可视化，原始数值来自遥测。</div></section>
  <aside class="side">
    <section class="card card-pad"><h2>点击关节</h2><div id="jointMap" class="joint-map"></div></section>
    <section class="card card-pad"><h2 id="chartTitle">六维传递力 / 力矩</h2><canvas id="chart" width="900" height="420"></canvas><div id="stats" class="stats"></div></section>
    <section class="card card-pad legend">六维传递量的原点是当前关节 anchor，坐标轴与世界坐标系一致。力矩由 cfrc_int 的 COM 参考点平移到关节原点，并非真机传感器读数。驱动力矩与惯性力矩分别来自 qfrc_actuator 和 M(q)qacc。</section>
  </aside>
</main>
<script src="telemetry.js"></script>
<script>
const data=window.PHYSICS_TELEMETRY, video=document.getElementById('video'), canvas=document.getElementById('chart'), ctx=canvas.getContext('2d');
let selected=data.joint_names[0];
const positions={head_pitch:[50,13],left_hip_pitch:[31,34],right_hip_pitch:[69,34],left_knee:[26,55],right_knee:[74,55],left_ankle:[20,72],right_ankle:[80,72],passive_LF_wheel:[17,89],passive_RF_wheel:[83,89]};
const map=document.getElementById('jointMap');
data.joint_names.forEach((name,i)=>{const b=document.createElement('button');b.className='joint';b.textContent=name;const p=positions[name]||[15+(i%4)*23,20+Math.floor(i/4)*32];b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.onclick=()=>{selected=name;syncButtons();draw()};b.dataset.name=name;map.appendChild(b)});
function syncButtons(){document.querySelectorAll('.joint').forEach(b=>b.classList.toggle('active',b.dataset.name===selected));document.getElementById('chartTitle').textContent=selected+' · 六维传递力 / 力矩'}
function recordIndex(){return Math.min(data.records.length-1,Math.max(0,Math.round(video.currentTime*data.control_hz)))}
function drawSeries(records,key,axis,color,y0,h,maxAbs){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();records.forEach((r,i)=>{const v=r.joints[selected][key][axis],x=54+i*(canvas.width-76)/Math.max(1,records.length-1),y=y0+h/2-v/maxAbs*h*.44;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function draw(){const idx=recordIndex(),from=Math.max(0,idx-data.control_hz*6),records=data.records.slice(from,idx+1),j=data.records[idx].joints[selected];ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#07111e';ctx.fillRect(0,0,canvas.width,canvas.height);const sets=[['force_n',['#56c0ff','#44e7a6','#ff6f91'],38,150,'N'],['torque_nm',['#ffb94b','#b37dff','#ff5b4a'],230,150,'N·m']];sets.forEach((s,si)=>{const vals=records.flatMap(r=>r.joints[selected][s[0]]),m=Math.max(.001,...vals.map(Math.abs));ctx.strokeStyle='#2b3d53';ctx.beginPath();ctx.moveTo(48,s[2]+75);ctx.lineTo(882,s[2]+75);ctx.stroke();for(let a=0;a<3;a++)drawSeries(records,s[0],a,s[1][a],s[2],s[3],m);ctx.fillStyle='#8ba0b6';ctx.fillText((si?'Torque Tx/Ty/Tz ':'Force Fx/Fy/Fz ')+'±'+m.toFixed(2)+' '+s[4],54,s[2]-10)});const fmt=(v,u)=>'<b>'+Number(v).toFixed(3)+' '+u+'</b>',txt=v=>'<b>'+v+'</b>';document.getElementById('stats').innerHTML='<div class="stat">位移'+fmt(j.displacement_rad,'rad')+'</div><div class="stat">驱动力矩'+fmt(j.drive_torque_nm,'N·m')+'</div><div class="stat">惯性力矩'+fmt(j.inertia_torque_nm,'N·m')+'</div><div class="stat">约束力矩'+fmt(j.constraint_torque_nm,'N·m')+'</div><div class="stat">姿态 R/P/Y'+txt(j.body_rpy_deg.map(v=>v.toFixed(1)).join(' / ')+' °')+'</div><div class="stat">时间'+fmt(data.records[idx].time_s,'s')+'</div>'}
video.addEventListener('timeupdate',draw);syncButtons();draw();
</script>
</body></html>
